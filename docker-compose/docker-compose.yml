      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airlink

  redis:
    image: redis:7.2-alpine
    container_name: airlink-redis
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - airlink

  kafka:
    image: apache/kafka:4.1.1
    container_name: airlink-kafka
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx1g"
    networks:
      - airlink

  service-registry:
    image: "satyam62/service-registry"
    container_name: airlink-eureka-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airlink

  api-gateway:
    image: "satyam62/api-gateway"
    container_name: airlink-api-gateway
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "9000:9000"
    depends_on:
      service-registry:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airlink

  user-service:
    image: "satyam62/user-service"
    container_name: airlink-user-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      service-registry:
        condition: service_started
      userdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://userdb:3306/user_service?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "Golu@1234"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
    networks:
      - airlink

  airline-core-service:
