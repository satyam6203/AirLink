services:

  userdb:
    image: mysql:8.0
    container_name: userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3302:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Golu@1234"
      MYSQL_DATABASE: user_service
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - airlink

  airlinecoredb:
    image: mysql:8.0
    container_name: airlinecoredb
